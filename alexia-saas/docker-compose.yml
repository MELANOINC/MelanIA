version: '3.8'

services:
  alexia-backend:
    build: .
    container_name: alexia-saas-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${DB_USER:-alexia}:${DB_PASSWORD:-alexia_pass}@postgres:5432/${DB_NAME:-alexia_saas}
      - API_KEY_SECRET=${API_KEY_SECRET}
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER:-twilio}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_WHATSAPP_NUMBER=${TWILIO_WHATSAPP_NUMBER}
      - META_WHATSAPP_TOKEN=${META_WHATSAPP_TOKEN}
      - META_PHONE_NUMBER_ID=${META_PHONE_NUMBER_ID}
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - alexia-network
    volumes:
      - alexia-logs:/app/logs

  postgres:
    image: postgres:15-alpine
    container_name: alexia-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-alexia}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-alexia_pass}
      - POSTGRES_DB=${DB_NAME:-alexia_saas}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alexia} -d ${DB_NAME:-alexia_saas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alexia-network

networks:
  alexia-network:
    driver: bridge

volumes:
  postgres-data:
  alexia-logs:
